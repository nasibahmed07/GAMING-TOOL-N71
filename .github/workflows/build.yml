          package com.n7elite.gaming.ui

          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.LinearProgressIndicator
          import androidx.compose.material3.Text
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.n7elite.gaming.data.*
          import com.n7elite.gaming.ui.theme.*
          import kotlin.math.roundToInt
          import kotlinx.coroutines.delay

          @Composable
          fun PerformanceScreen(onBack: () -> Unit) {
              val ctx = LocalContext.current
              var s by remember { mutableStateOf(DeviceReader.read(ctx)) }
              LaunchedEffect(Unit) {
                  while (true) {
                      delay(3000)
                      s = DeviceReader.read(ctx)
                  }
              }
              val ramUsed = (1f - s.availRamMb.toFloat() / s.totalRamMb.toFloat()).coerceIn(0f, 1f)
              val storUsed = (1.0 - s.freeStorageGb / s.totalStorageGb).toFloat().coerceIn(0f, 1f)

              val tips = mutableListOf<String>()
              val storFree = 100f - storUsed * 100f
              if (storFree < 15f) tips.add("Free storage is ${storFree.roundToInt()}%. Keep at least 15 to 20% free for smooth games and updates. Remove unused apps, videos and cache.")
              val ramFree = 100f - ramUsed * 100f
              if (ramFree < 25f) tips.add("Only ${ramFree.roundToInt()}% of RAM is free. Close background apps from the recent apps screen before you play.")
              s.batteryTempC?.let { if (it >= 40f) tips.add("Battery is ${"%.1f".format(it)} C. Remove the case, avoid charging while gaming and let the phone cool down.") }
              s.batteryPercent?.let { if (it < 20 && s.charging != true) tips.add("Battery is $it%. Charge first or turn on battery saver; low battery can reduce performance.") }
              if (tips.isEmpty()) tips.add("Your readings look healthy right now. Nothing needs fixing.")

              Column(
                  Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(16.dp),
                  verticalArrangement = Arrangement.spacedBy(14.dp)
              ) {
                  Header("DEVICE PERFORMANCE", onBack)

                  GlassCard("LIVE READINGS (every 3 seconds)") {
                      InfoRow("Model", s.model)
                      InfoRow("System", s.androidVersion)
                      InfoRow("CPU cores", "${s.cores}")
                      InfoRow("Screen", "${s.resolution} px")
                      InfoRow("Screen density", "${s.densityDpi} dpi")
                      InfoRow("Refresh rate", if (s.refreshHz > 0f) "${s.refreshHz.roundToInt()} Hz" else "Unavailable")
                      Spacer(Modifier.height(8.dp))
                      InfoRow("RAM free", "${s.availRamMb} MB of ${s.totalRamMb} MB")
                      LinearProgressIndicator(progress = { ramUsed }, modifier = Modifier.fillMaxWidth(), color = N7Red, trackColor = Color(0x33FFFFFF))
                      Spacer(Modifier.height(8.dp))
