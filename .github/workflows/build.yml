          package com.n7elite.gaming.data

          import android.content.Context
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import org.json.JSONArray
          import org.json.JSONObject
          import java.util.UUID

          /** Holds everything the app remembers. Saved on this phone only (SharedPreferences). */
          class AppState(context: Context) {
              private val sp = context.getSharedPreferences("n7elite", Context.MODE_PRIVATE)

              var profiles by mutableStateOf(loadProfiles())
              var activeId by mutableStateOf(sp.getString("active", "") ?: "")
              var records by mutableStateOf(loadRecords())
              var activity by mutableStateOf(loadActivity())
              var haptics by mutableStateOf(sp.getBoolean("haptics", true))
              var onboarded by mutableStateOf(sp.getBoolean("onboarded", false))
              var recoilBest by mutableStateOf(sp.getInt("recoilBest", 0))

              val active: Profile
                  get() = profiles.firstOrNull { it.id == activeId } ?: profiles.first()

              init {
                  if (profiles.none { it.id == activeId }) {
                      activeId = profiles.first().id
                      save()
                  }
              }

              private fun newProfile(style: String, name: String = "$style Player") =
                  Profile(UUID.randomUUID().toString(), name, style, Sens.template(style), Hud.preset("Default"), 1)

              private fun loadProfiles(): List<Profile> {
                  try {
                      val s = sp.getString("profiles", null)
                      if (s != null) {
                          val a = JSONArray(s)
                          val l = List(a.length()) { Profile.fromJson(a.getJSONObject(it)) }
                          if (l.isNotEmpty()) return l
                      }
                  } catch (e: Exception) {
                  }
                  return listOf("Balanced", "Rush", "Sniper", "Custom").map { newProfile(it) }
              }

              private fun loadRecords(): List<TrainRecord> {
                  return try {
                      val a = JSONArray(sp.getString("records", "[]"))
                      List(a.length()) { TrainRecord.fromJson(a.getJSONObject(it)) }
                  } catch (e: Exception) {
                      emptyList()
                  }
              }

              private fun loadActivity(): List<String> {
                  return try {
                      val a = JSONArray(sp.getString("activity", "[]"))
                      List(a.length()) { a.getString(it) }
                  } catch (e: Exception) {
                      emptyList()
                  }
              }

              fun save() {
                  val a = JSONArray()
                  profiles.forEach { a.put(it.toJson()) }
                  sp.edit().putString("profiles", a.toString()).putString("active", activeId).apply()
              }

              fun update(p: Profile, save: Boolean = true) {
                  profiles = profiles.map { if (it.id == p.id) p else it }
                  if (save) this.save()
              }

              fun addProfile(style: String) {
                  val p = newProfile(style, "$style Player ${profiles.size + 1}")
                  profiles = profiles + p
                  save()
                  log("Created profile ${p.name}")
              }

              fun duplicate(p: Profile) {
                  val c = p.copy(id = UUID.randomUUID().toString(), name = (p.name + " copy").take(24))
                  profiles = profiles + c
                  save()
                  log("Duplicated ${p.name}")
              }

              fun delete(p: Profile) {
                  if (profiles.size <= 1) return
                  profiles = profiles.filter { it.id != p.id }
                  if (activeId == p.id) activeId = profiles.first().id
                  save()
                  log("Deleted ${p.name}")
              }

              fun setActive(id: String) {
                  activeId = id
                  save()
                  log("Active profile: ${active.name}")
              }

              fun log(msg: String) {
                  activity = (listOf("${System.currentTimeMillis()}|$msg") + activity).take(12)
                  sp.edit().putString("activity", JSONArray(activity).toString()).apply()
              }

              fun best(mode: String, diff: String): Int = sp.getInt("best_${mode}_$diff", 0)

              fun addRecord(r: TrainRecord) {
                  if (r.score > best(r.mode, r.diff)) sp.edit().putInt("best_${r.mode}_${r.diff}", r.score).apply()
                  records = (listOf(r) + records).take(50)
                  val a = JSONArray()
                  records.forEach { a.put(it.toJson()) }
                  sp.edit().putString("records", a.toString()).apply()
                  log("${r.mode} ${r.diff}: score ${r.score}, accuracy ${r.accuracy}%")
              }

              fun setRecoilBest(v: Int) {
                  recoilBest = v
                  sp.edit().putInt("recoilBest", v).apply()
              }

              fun setHaptics(v: Boolean) {
                  haptics = v
                  sp.edit().putBoolean("haptics", v).apply()
              }

              fun finishOnboarding() {
                  onboarded = true
                  sp.edit().putBoolean("onboarded", true).apply()
              }

              fun exportJson(p: Profile): String =
                  JSONObject().put("n7elite", 1).put("profile", p.toJson()).toString()

              fun importJson(text: String): String {
                  return try {
                      val o = JSONObject(text.trim())
                      val p = Profile.fromJson(o.getJSONObject("profile"))
                      val np = p.copy(id = UUID.randomUUID().toString(), name = (p.name + " (imported)").take(30))
                      profiles = profiles + np
                      save()
                      log("Imported ${np.name}")
                      "Imported: ${np.name}"
                  } catch (e: Exception) {
                      "That text is not a valid N7 ELITE configuration."
                  }
              }

              fun resetAll() {
                  sp.edit().clear().putBoolean("onboarded", true).apply()
                  profiles = loadProfiles()
                  activeId = profiles.first().id
                  records = emptyList()
                  activity = emptyList()
                  recoilBest = 0
                  haptics = true
                  save()
              }
          }
          N7EOF
          mkdir -p app/src/main/java/com/n7elite/gaming/data
          cat > app/src/main/java/com/n7elite/gaming/data/DeviceReader.kt <<'N7EOF'
          package com.n7elite.gaming.data

          import android.app.ActivityManager
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.os.BatteryManager
          import android.os.Build
          import android.os.Environment
          import android.os.StatFs
          import android.view.WindowManager

          /** Real values read from the phone. Null means "Android did not give us this value". */
          data class DeviceSnapshot(
              val model: String,
              val androidVersion: String,
              val totalRamMb: Long,
              val availRamMb: Long,
              val totalStorageGb: Double,
              val freeStorageGb: Double,
              val batteryPercent: Int?,
              val batteryTempC: Float?,
              val charging: Boolean?,
              val densityDpi: Int,
              val resolution: String,
              val refreshHz: Float,
              val cores: Int,
              val appMemMb: Long
          )

          object DeviceReader {
              @Suppress("DEPRECATION")
              fun read(context: Context): DeviceSnapshot {
                  val am = context.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                  val mem = ActivityManager.MemoryInfo()
                  am.getMemoryInfo(mem)

                  val stat = StatFs(Environment.getDataDirectory().path)
                  val gb = 1024.0 * 1024.0 * 1024.0

                  val battery: Intent? = context.registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                  val level = battery?.getIntExtra(BatteryManager.EXTRA_LEVEL, -1) ?: -1
                  val scale = battery?.getIntExtra(BatteryManager.EXTRA_SCALE, -1) ?: -1
                  val percent = if (level >= 0 && scale > 0) level * 100 / scale else null
                  val tempRaw = battery?.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, Int.MIN_VALUE)
                  val temp = if (tempRaw != null && tempRaw != Int.MIN_VALUE) tempRaw / 10f else null
                  val status = battery?.getIntExtra(BatteryManager.EXTRA_STATUS, -1) ?: -1
                  val charging = if (battery == null) null else
                      (status == BatteryManager.BATTERY_STATUS_CHARGING || status == BatteryManager.BATTERY_STATUS_FULL)

                  val dm = context.resources.displayMetrics
                  val wm = context.getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val hz = try { wm.defaultDisplay.refreshRate } catch (e: Exception) { 0f }
                  val rt = Runtime.getRuntime()

                  return DeviceSnapshot(
                      model = "${Build.MANUFACTURER} ${Build.MODEL}",
                      androidVersion = "Android ${Build.VERSION.RELEASE} (API ${Build.VERSION.SDK_INT})",
                      totalRamMb = mem.totalMem / (1024 * 1024),
                      availRamMb = mem.availMem / (1024 * 1024),
                      totalStorageGb = stat.totalBytes / gb,
                      freeStorageGb = stat.availableBytes / gb,
                      batteryPercent = percent,
                      batteryTempC = temp,
                      charging = charging,
                      densityDpi = dm.densityDpi,
                      resolution = "${dm.widthPixels} x ${dm.heightPixels}",
                      refreshHz = hz,
                      cores = rt.availableProcessors(),
                      appMemMb = (rt.totalMemory() - rt.freeMemory()) / (1024 * 1024)
                  )
              }
          }
