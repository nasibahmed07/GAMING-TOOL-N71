name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Create project files
        run: |
          cat > settings.gradle.kts <<'N7EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "N7ELITE"
          include(":app")
          N7EOF
          cat > build.gradle.kts <<'N7EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          N7EOF
          cat > gradle.properties <<'N7EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          N7EOF
          mkdir -p app
          cat > app/build.gradle.kts <<'N7EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.n7elite.gaming"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.n7elite.gaming"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "0.1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.3")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
          }
          N7EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'N7EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.N7Elite">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          N7EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'N7EOF'
          <resources>
              <string name="app_name">N7 ELITE</string>
          </resources>
          N7EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/themes.xml <<'N7EOF'
          <resources>
              <style name="Theme.N7Elite" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">#0B0B0F</item>
                  <item name="android:statusBarColor">#0B0B0F</item>
                  <item name="android:navigationBarColor">#0B0B0F</item>
              </style>
          </resources>
          N7EOF
          mkdir -p app/src/main/java/com/n7elite/gaming
          cat > app/src/main/java/com/n7elite/gaming/MainActivity.kt <<'N7EOF'
          package com.n7elite.gaming

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import com.n7elite.gaming.ui.DashboardScreen
          import com.n7elite.gaming.ui.theme.N7Theme

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      N7Theme {
                          DashboardScreen()
                      }
                  }
              }
          }
          N7EOF
          mkdir -p app/src/main/java/com/n7elite/gaming/ui/theme
          cat > app/src/main/java/com/n7elite/gaming/ui/theme/Theme.kt <<'N7EOF'
          package com.n7elite.gaming.ui.theme

          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.graphics.Color

          val N7Black = Color(0xFF0B0B0F)
          val N7Charcoal = Color(0xFF16161D)
          val N7Red = Color(0xFFFF1744)
          val N7Blue = Color(0xFF29B6F6)
          val N7TextDim = Color(0xFF9A9AA8)

          private val N7Colors = darkColorScheme(
              primary = N7Red,
              secondary = N7Blue,
              background = N7Black,
              surface = N7Charcoal,
              onPrimary = Color.White,
              onSecondary = Color.Black,
              onBackground = Color(0xFFF2F2F7),
              onSurface = Color(0xFFF2F2F7)
          )

          @Composable
          fun N7Theme(content: @Composable () -> Unit) {
              MaterialTheme(colorScheme = N7Colors, content = content)
          }
          N7EOF
          mkdir -p app/src/main/java/com/n7elite/gaming/data
          cat > app/src/main/java/com/n7elite/gaming/data/DeviceReader.kt <<'N7EOF'
          package com.n7elite.gaming.data

          import android.app.ActivityManager
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.os.BatteryManager
          import android.os.Build
          import android.os.Environment
          import android.os.StatFs

          /** Real values read from the phone. Null means "Android did not give us this value". */
          data class DeviceSnapshot(
              val model: String,
              val androidVersion: String,
              val totalRamMb: Long,
              val availRamMb: Long,
              val totalStorageGb: Double,
              val freeStorageGb: Double,
              val batteryPercent: Int?,
              val batteryTempC: Float?
          )

          object DeviceReader {
              fun read(context: Context): DeviceSnapshot {
                  val am = context.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                  val mem = ActivityManager.MemoryInfo()
                  am.getMemoryInfo(mem)

                  val stat = StatFs(Environment.getDataDirectory().path)
                  val gb = 1024.0 * 1024.0 * 1024.0

                  val battery: Intent? = context.registerReceiver(
                      null, IntentFilter(Intent.ACTION_BATTERY_CHANGED)
                  )
                  val level = battery?.getIntExtra(BatteryManager.EXTRA_LEVEL, -1) ?: -1
                  val scale = battery?.getIntExtra(BatteryManager.EXTRA_SCALE, -1) ?: -1
                  val percent = if (level >= 0 && scale > 0) level * 100 / scale else null
                  val tempRaw = battery?.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, Int.MIN_VALUE)
                  val temp = if (tempRaw != null && tempRaw != Int.MIN_VALUE) tempRaw / 10f else null

                  return DeviceSnapshot(
                      model = "${Build.MANUFACTURER} ${Build.MODEL}",
                      androidVersion = "Android ${Build.VERSION.RELEASE} (API ${Build.VERSION.SDK_INT})",
                      totalRamMb = mem.totalMem / (1024 * 1024),
                      availRamMb = mem.availMem / (1024 * 1024),
                      totalStorageGb = stat.totalBytes / gb,
                      freeStorageGb = stat.availableBytes / gb,
                      batteryPercent = percent,
                      batteryTempC = temp
                  )
              }
          }
          N7EOF
          mkdir -p app/src/main/java/com/n7elite/gaming/ui
          cat > app/src/main/java/com/n7elite/gaming/ui/DashboardScreen.kt <<'N7EOF'
          package com.n7elite.gaming.ui

          import androidx.compose.foundation.BorderStroke
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.Arrangement
          import androidx.compose.foundation.layout.Column
          import androidx.compose.foundation.layout.Row
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.foundation.layout.fillMaxWidth
          import androidx.compose.foundation.layout.padding
          import androidx.compose.foundation.layout.statusBarsPadding
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.Button
          import androidx.compose.material3.ButtonDefaults
          import androidx.compose.material3.Card
          import androidx.compose.material3.CardDefaults
          import androidx.compose.material3.Text
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.remember
          import androidx.compose.runtime.setValue
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.n7elite.gaming.data.DeviceReader
          import com.n7elite.gaming.ui.theme.N7Black
          import com.n7elite.gaming.ui.theme.N7Blue
          import com.n7elite.gaming.ui.theme.N7Charcoal
          import com.n7elite.gaming.ui.theme.N7Red
          import com.n7elite.gaming.ui.theme.N7TextDim

          @Composable
          fun DashboardScreen() {
              val context = LocalContext.current
              var snapshot by remember { mutableStateOf(DeviceReader.read(context)) }

              LazyColumn(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Brush.verticalGradient(listOf(N7Black, N7Charcoal)))
                      .statusBarsPadding(),
                  contentPadding = androidx.compose.foundation.layout.PaddingValues(16.dp),
                  verticalArrangement = Arrangement.spacedBy(14.dp)
              ) {
                  item {
                      Column {
                          Text(
                              "N7 ELITE",
                              color = N7Red,
                              fontSize = 34.sp,
                              fontWeight = FontWeight.Black,
                              fontFamily = FontFamily.Monospace,
                              letterSpacing = 4.sp
                          )
                          Text("Gaming control panel", color = N7Blue, fontSize = 13.sp, letterSpacing = 2.sp)
                      }
                  }

                  item {
                      GlassCard(title = "ACTIVE PROFILE") {
                          Text("Balanced Player", fontSize = 20.sp, fontWeight = FontWeight.Bold)
                          Text(
                              "Default profile. Profile editing arrives in Stage 3.",
                              color = N7TextDim, fontSize = 12.sp
                          )
                      }
                  }

                  item {
                      GlassCard(title = "DEVICE") {
                          InfoRow("Model", snapshot.model)
                          InfoRow("System", snapshot.androidVersion)
                          InfoRow("RAM free", "${snapshot.availRamMb} MB of ${snapshot.totalRamMb} MB")
                          InfoRow(
                              "Storage free",
                              "%.1f GB of %.1f GB".format(snapshot.freeStorageGb, snapshot.totalStorageGb)
                          )
                          InfoRow("Battery", snapshot.batteryPercent?.let { "$it%" } ?: "Unavailable")
                          InfoRow(
                              "Battery temp",
                              snapshot.batteryTempC?.let { "%.1f °C".format(it) } ?: "Unavailable"
                          )
                          InfoRow("Live FPS", "Not measurable by this app")
                          Button(
                              onClick = { snapshot = DeviceReader.read(context) },
                              colors = ButtonDefaults.buttonColors(containerColor = N7Red),
                              modifier = Modifier.padding(top = 10.dp)
                          ) { Text("Refresh") }
                      }
                  }

                  item {
                      GlassCard(title = "MODULES") {
                          ModuleRow("Sensitivity Manager", "Stage 2")
                          ModuleRow("Gaming Profiles", "Stage 3")
                          ModuleRow("HUD Configurator", "Stage 4")
                          ModuleRow("Aim Training", "Stage 5")
                          ModuleRow("Recoil Simulator", "Stage 6")
                          ModuleRow("Device Performance", "Stage 7")
                      }
                  }
              }
          }

          @Composable
          private fun GlassCard(title: String, content: @Composable () -> Unit) {
              Card(
                  modifier = Modifier.fillMaxWidth(),
                  shape = RoundedCornerShape(18.dp),
                  colors = CardDefaults.cardColors(containerColor = Color(0x33FFFFFF)),
                  border = BorderStroke(1.dp, Brush.linearGradient(listOf(N7Red, N7Blue)))
              ) {
                  Column(Modifier.padding(16.dp)) {
                      Text(title, color = N7Blue, fontSize = 12.sp, letterSpacing = 2.sp, fontWeight = FontWeight.Bold)
                      Column(Modifier.padding(top = 8.dp)) { content() }
                  }
              }
          }

          @Composable
          private fun InfoRow(label: String, value: String) {
              Row(
                  Modifier.fillMaxWidth().padding(vertical = 3.dp),
                  horizontalArrangement = Arrangement.SpaceBetween,
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Text(label, color = N7TextDim, fontSize = 13.sp)
                  Text(value, fontSize = 13.sp, fontWeight = FontWeight.Medium)
              }
          }

          @Composable
          private fun ModuleRow(name: String, stage: String) {
              Row(
                  Modifier.fillMaxWidth().padding(vertical = 5.dp),
                  horizontalArrangement = Arrangement.SpaceBetween
              ) {
                  Text(name, fontSize = 14.sp)
                  Text("Coming in $stage", color = N7TextDim, fontSize = 12.sp)
              }
          }
          N7EOF

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: N7ELITE-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
