          mkdir -p app/src/main/java/com/n7elite/gaming
          cat > app/src/main/java/com/n7elite/gaming/MainActivity.kt <<'N7EOF'
          package com.n7elite.gaming

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.BackHandler
          import androidx.activity.compose.setContent
          import androidx.compose.animation.core.RepeatMode
          import androidx.compose.animation.core.animateFloat
          import androidx.compose.animation.core.infiniteRepeatable
          import androidx.compose.animation.core.rememberInfiniteTransition
          import androidx.compose.animation.core.tween
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.CircularProgressIndicator
          import androidx.compose.material3.Text
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.n7elite.gaming.data.AppState
          import com.n7elite.gaming.ui.*
          import com.n7elite.gaming.ui.theme.*
          import kotlinx.coroutines.delay

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      N7Theme {
                          N7App()
                      }
                  }
              }
          }

          @Composable
          fun N7App() {
              val ctx = LocalContext.current
              val app = remember { AppState(ctx.applicationContext) }
              var splash by remember { mutableStateOf(true) }
              var screen by remember { mutableStateOf(Screen.Dashboard) }

              LaunchedEffect(Unit) {
                  delay(1400)
                  splash = false
              }
              BackHandler(enabled = !splash && screen != Screen.Dashboard) { screen = Screen.Dashboard }

              if (splash) {
                  SplashScreen()
              } else if (!app.onboarded) {
                  OnboardingScreen { app.finishOnboarding() }
              } else {
                  val back = { screen = Screen.Dashboard }
                  Box(
                      Modifier
                          .fillMaxSize()
                          .background(Brush.verticalGradient(listOf(N7Black, N7Charcoal)))
                          .statusBarsPadding()
                          .navigationBarsPadding()
                  ) {
                      when (screen) {
                          Screen.Dashboard -> DashboardScreen(app) { screen = it }
                          Screen.Sensitivity -> SensitivityScreen(app, back)
                          Screen.Profiles -> ProfilesScreen(app, back)
                          Screen.Hud -> HudScreen(app, back)
                          Screen.Aim -> AimScreen(app, back)
                          Screen.Recoil -> RecoilScreen(app, back)
                          Screen.Perf -> PerformanceScreen(back)
                          Screen.Settings -> SettingsScreen(app, back)
                      }
                  }
              }
          }

          @Composable
          fun SplashScreen() {
              val t = rememberInfiniteTransition(label = "splash")
              val a by t.animateFloat(0.3f, 1f, infiniteRepeatable(tween(700), RepeatMode.Reverse), label = "alpha")
              Box(Modifier.fillMaxSize().background(N7Black), contentAlignment = Alignment.Center) {
                  Column(horizontalAlignment = Alignment.CenterHorizontally) {
                      Text(
                          "N7 ELITE", color = N7Red.copy(alpha = a), fontSize = 38.sp,
                          fontWeight = FontWeight.Black, fontFamily = FontFamily.Monospace, letterSpacing = 4.sp
                      )
                      Spacer(Modifier.height(20.dp))
                      CircularProgressIndicator(color = N7Blue)
                  }
              }
          }

          @Composable
          fun OnboardingScreen(onDone: () -> Unit) {
              val pages = listOf(
                  "Welcome to N7 ELITE" to "A training and planning panel for Free Fire players: sensitivity presets, a HUD layout planner, an aim trainer and a recoil simulator.",
                  "Presets, not hacks" to "N7 ELITE never touches Free Fire. It does not change game settings, read game memory or automate anything. You copy the values into the game yourself.",
                  "Train, then tune" to "Play the Aim Training and Recoil Simulator, then let the Sensitivity Manager suggest small changes based on your real results."
              )
              var i by remember { mutableIntStateOf(0) }
              Column(
                  Modifier.fillMaxSize().background(N7Black).statusBarsPadding().navigationBarsPadding().padding(28.dp),
                  verticalArrangement = Arrangement.Center
              ) {
                  Text(pages[i].first, color = N7Red, fontSize = 26.sp, fontWeight = FontWeight.Black)
                  Spacer(Modifier.height(14.dp))
                  Text(pages[i].second, fontSize = 16.sp, lineHeight = 24.sp)
                  Spacer(Modifier.height(10.dp))
                  Text("${i + 1} / ${pages.size}", color = N7TextDim, fontSize = 12.sp)
                  Spacer(Modifier.height(24.dp))
                  Btn(if (i < pages.size - 1) "Next" else "Get started") {
                      if (i < pages.size - 1) i++ else onDone()
                  }
              }
          }
