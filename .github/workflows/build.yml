          package com.n7elite.gaming.data

          import org.json.JSONArray
          import org.json.JSONObject

          val SENS_LABELS = listOf("General", "Red Dot", "2X Scope", "4X Scope", "Sniper Scope", "Free Look")

          data class Sens(val v: List<Int> = listOf(90, 85, 80, 75, 60, 70)) {
              fun set(i: Int, x: Int): Sens = Sens(v.toMutableList().also { it[i] = x.coerceIn(0, 100) })

              fun toJson(): JSONArray {
                  val a = JSONArray()
                  v.forEach { a.put(it) }
                  return a
              }

              companion object {
                  fun template(style: String): Sens = when (style) {
                      "Rush" -> Sens(listOf(95, 90, 85, 80, 70, 65))
                      "Sniper" -> Sens(listOf(85, 80, 75, 72, 55, 60))
                      else -> Sens(listOf(90, 85, 80, 75, 60, 70))
                  }

                  fun fromJson(a: JSONArray?): Sens {
                      if (a == null || a.length() != 6) return Sens()
                      return Sens(List(6) { a.optInt(it, 50).coerceIn(0, 100) })
                  }
              }
          }

          data class HudItem(val id: String, val label: String, val x: Float, val y: Float)

          data class Hud(val items: List<HudItem>, val fireSize: Int = 80, val opacity: Int = 70) {
              fun move(id: String, x: Float, y: Float): Hud =
                  copy(items = items.map { if (it.id == id) it.copy(x = x, y = y) else it })

              fun toJson(): JSONObject {
                  val a = JSONArray()
                  items.forEach {
                      a.put(JSONObject().put("id", it.id).put("l", it.label).put("x", it.x.toDouble()).put("y", it.y.toDouble()))
                  }
                  return JSONObject().put("items", a).put("fs", fireSize).put("op", opacity)
              }

              companion object {
                  fun preset(name: String): Hud {
                      val base = listOf(
                          HudItem("fire", "FIRE", 0.86f, 0.62f),
                          HudItem("fireL", "FIRE", 0.12f, 0.62f),
                          HudItem("jump", "JUMP", 0.94f, 0.86f),
                          HudItem("crouch", "CRCH", 0.78f, 0.86f),
                          HudItem("scope", "SCOPE", 0.80f, 0.38f),
                          HudItem("reload", "RLD", 0.66f, 0.84f)
                      )
                      return when (name) {
                          "Wide fire" -> Hud(base, 100, 85)
                          "Compact" -> Hud(
                              base.map { it.copy(x = if (it.x > 0.5f) it.x + 0.04f else it.x - 0.04f) },
                              60, 60
                          )
                          else -> Hud(base, 80, 70)
                      }
                  }

                  fun fromJson(o: JSONObject?): Hud {
                      if (o == null) return preset("Default")
                      val a = o.optJSONArray("items") ?: return preset("Default")
                      val list = List(a.length()) {
                          val j = a.getJSONObject(it)
                          HudItem(
                              j.getString("id"), j.optString("l", "?"),
                              j.optDouble("x", 0.5).toFloat().coerceIn(0f, 1f),
                              j.optDouble("y", 0.5).toFloat().coerceIn(0f, 1f)
                          )
                      }
                      if (list.isEmpty()) return preset("Default")
                      return Hud(list, o.optInt("fs", 80).coerceIn(40, 120), o.optInt("op", 70).coerceIn(20, 100))
                  }
              }
          }

          data class Profile(
              val id: String,
              val name: String,
              val style: String,
              val sens: Sens,
              val hud: Hud,
              val difficulty: Int = 1
          ) {
              fun toJson(): JSONObject = JSONObject()
                  .put("id", id).put("name", name).put("style", style)
                  .put("sens", sens.toJson()).put("hud", hud.toJson()).put("diff", difficulty)

              companion object {
                  fun fromJson(o: JSONObject): Profile = Profile(
                      o.getString("id"),
                      o.optString("name", "Profile"),
                      o.optString("style", "Custom"),
                      Sens.fromJson(o.optJSONArray("sens")),
                      Hud.fromJson(o.optJSONObject("hud")),
                      o.optInt("diff", 1).coerceIn(0, 2)
                  )
              }
          }

          data class TrainRecord(
              val time: Long,
              val mode: String,
              val diff: String,
              val score: Int,
              val hits: Int,
              val misses: Int,
              val accuracy: Int,
              val avgReaction: Int
          ) {
              fun toJson(): JSONObject = JSONObject()
                  .put("t", time).put("m", mode).put("d", diff).put("s", score)
                  .put("h", hits).put("x", misses).put("a", accuracy).put("r", avgReaction)

              companion object {
                  fun fromJson(o: JSONObject) = TrainRecord(
                      o.getLong("t"), o.getString("m"), o.getString("d"), o.getInt("s"),
                      o.getInt("h"), o.getInt("x"), o.getInt("a"), o.optInt("r", 0)
                  )
              }
          }
