              <style name="Theme.N7Elite" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">#0B0B0F</item>
                  <item name="android:statusBarColor">#0B0B0F</item>
                  <item name="android:navigationBarColor">#0B0B0F</item>
              </style>
          </resources>
          N7EOF
          cat > build.gradle.kts <<'N7EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          N7EOF
          cat > gradle.properties <<'N7EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          N7EOF
          cat > settings.gradle.kts <<'N7EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "N7ELITE"
          include(":app")
          N7EOF

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: N7ELITE-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
