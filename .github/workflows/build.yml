          @Composable
          fun SensitivityScreen(app: AppState, onBack: () -> Unit) {
              val ctx = LocalContext.current
              val p = app.active
              var sel by remember { mutableIntStateOf(0) }
              var dot by remember { mutableStateOf(Offset(-1f, -1f)) }
              var padInfo by remember { mutableStateOf("Drag inside the pad to feel the sensitivity") }
              var importText by remember { mutableStateOf("") }
              var importMsg by remember { mutableStateOf("") }
              val base = Sens.template(p.style)
              val dpi = ctx.resources.displayMetrics.densityDpi

              Column(
                  Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(16.dp),
                  verticalArrangement = Arrangement.spacedBy(14.dp)
              ) {
                  Header("SENSITIVITY", onBack)

                  GlassCard("PROFILE: ${p.name}") {
                      SENS_LABELS.forEachIndexed { i, label ->
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Text(label, Modifier.weight(1f), fontWeight = if (sel == i) FontWeight.Bold else FontWeight.Normal)
                              Text("${p.sens.v[i]}", color = N7Blue, fontWeight = FontWeight.Bold)
                              TextButton(onClick = {
                                  sel = i
                                  app.update(p.copy(sens = p.sens.set(i, base.v[i])))
                                  app.log("Reset $label sensitivity")
                              }) { Text("Reset") }
                          }
                          Slider(
                              value = p.sens.v[i].toFloat(),
                              onValueChange = {
                                  sel = i
                                  app.update(p.copy(sens = p.sens.set(i, it.roundToInt())), save = false)
                              },
                              valueRange = 0f..100f,
                              onValueChangeFinished = {
                                  app.save()
                                  app.log("$label set to ${app.active.sens.v[i]}")
                              },
                              colors = SliderDefaults.colors(thumbColor = N7Red, activeTrackColor = N7Red)
                          )
                      }
                      Btn("Reset all to ${p.style} start") {
                          app.update(p.copy(sens = base))
                          app.log("Reset all sensitivities")
                      }
                  }

                  GlassCard("LIVE PREVIEW: ${SENS_LABELS[sel]} (${p.sens.v[sel]})") {
                      val factor = p.sens.v[sel] / 50f
                      Box(
                          Modifier
                              .fillMaxWidth()
                              .height(180.dp)
                              .background(Color(0x22000000), RoundedCornerShape(12.dp))
                              .pointerInput(factor) {
                                  detectDragGestures { change, drag ->
                                      change.consume()
                                      val cur = if (dot.x < 0f) Offset(size.width / 2f, size.height / 2f) else dot
                                      dot = Offset(
                                          (cur.x + drag.x * factor).coerceIn(0f, size.width.toFloat()),
                                          (cur.y + drag.y * factor).coerceIn(0f, size.height.toFloat())
                                      )
                                      padInfo = "Finger ${drag.x.roundToInt()},${drag.y.roundToInt()} px -> crosshair ${(drag.x * factor).roundToInt()},${(drag.y * factor).roundToInt()} px"
                                  }
                              }
                      ) {
                          Canvas(Modifier.fillMaxSize()) {
                              val c = if (dot.x < 0f) Offset(size.width / 2f, size.height / 2f) else dot
                              drawLine(N7Red, Offset(c.x - 18f, c.y), Offset(c.x + 18f, c.y), 3f)
                              drawLine(N7Red, Offset(c.x, c.y - 18f), Offset(c.x, c.y + 18f), 3f)
                              drawCircle(N7Blue, 10f, c, style = Stroke(2f))
                          }
                      }
                      Dim(padInfo)
                      Dim("Higher value = the crosshair moves farther for the same swipe. 50 is 1:1 in this preview. Move any slider above to change what is previewed.")
                  }

                  GlassCard("STARTING POINTS") {
                      Dim("Common starting values by play style, not guaranteed best for you. Test them in Aim Training, then adjust.")
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          listOf("Rush", "Balanced", "Sniper").forEach { s ->
                              Btn(s, Modifier.weight(1f)) {
                                  app.update(p.copy(sens = Sens.template(s)))
                                  app.log("Applied $s starting values")
                              }
                          }
                      }
                  }

                  val recent = app.records.filter { it.mode != "Tracking" }.take(5)
                  GlassCard("TUNE FROM YOUR TRAINING") {
                      if (recent.size < 3) {
                          Text("Play at least 3 Static, Moving or Reaction rounds in Aim Training. Suggestions use your real accuracy.", fontSize = 13.sp)
                      } else {
                          val avg = recent.map { it.accuracy }.average().roundToInt()
                          val delta = if (avg < 55) -5 else if (avg > 85) 5 else 0
                          Text("Average accuracy over your last ${recent.size} rounds: $avg%", fontWeight = FontWeight.Bold)
                          Text(
                              when (delta) {
                                  -5 -> "Many misses. Try lowering General and Red Dot by 5 for steadier control."
                                  5 -> "Very accurate. You can try raising General and Red Dot by 5 for faster turns."
                                  else -> "Accuracy is in a good range. Keep your values and keep training."
                              },
                              fontSize = 13.sp
                          )
                          if (delta != 0) {
                              Spacer(Modifier.height(6.dp))
                              Btn("Apply suggestion") {
                                  val s = p.sens.set(0, p.sens.v[0] + delta).set(1, p.sens.v[1] + delta)
                                  app.update(p.copy(sens = s))
                                  app.log("Applied suggestion ($delta) to General and Red Dot")
                              }
                          }
                      }
                      Dim("A simple rule of thumb from your own results. It cannot promise more headshots.")
                  }

                  GlassCard("ABOUT DPI") {
                      Text("Your phone screen density is $dpi dpi (real value from your device).", fontSize = 13.sp)
                      Dim("Free Fire's own settings use the sensitivity values above, not a DPI setting. Changing the phone's screen DPI in developer options does not reliably improve aim and can break the display, so N7 ELITE does not touch it.")
                  }

                  GlassCard("EXPORT / IMPORT") {
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          Btn("Export", Modifier.weight(1f)) {
                              val i = Intent(Intent.ACTION_SEND).apply {
                                  type = "text/plain"
                                  putExtra(Intent.EXTRA_TEXT, app.exportJson(p))
                              }
                              ctx.startActivity(Intent.createChooser(i, "Export profile"))
                          }
                          Btn("Save as new", Modifier.weight(1f)) { app.duplicate(p) }
                      }
                      Spacer(Modifier.height(8.dp))
                      OutlinedTextField(
                          value = importText,
                          onValueChange = { importText = it },
                          label = { Text("Paste a configuration here") },
                          modifier = Modifier.fillMaxWidth()
                      )
                      Spacer(Modifier.height(6.dp))
                      Btn("Import") {
                          importMsg = app.importJson(importText)
                          if (importMsg.startsWith("Imported")) importText = ""
                      }
                      if (importMsg.isNotEmpty()) Dim(importMsg)
                  }
              }
          }
