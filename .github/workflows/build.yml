          import kotlin.math.roundToInt

          @Composable
          fun HudScreen(app: AppState, onBack: () -> Unit) {
              val p = app.active
              val hud = p.hud
              val dens = LocalDensity.current.density

              Column(
                  Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(16.dp),
                  verticalArrangement = Arrangement.spacedBy(14.dp)
              ) {
                  Header("HUD CONFIGURATOR", onBack)

                  GlassCard("DRAG THE BUTTONS  |  ${p.name}") {
                      BoxWithConstraints(
                          Modifier
                              .fillMaxWidth()
                              .aspectRatio(2f)
                              .clip(RoundedCornerShape(12.dp))
                              .background(Brush.verticalGradient(listOf(Color(0xFF1B2A3A), Color(0xFF0E1620))))
                      ) {
                          val wPx = constraints.maxWidth.toFloat()
                          val hPx = constraints.maxHeight.toFloat()
                          Canvas(Modifier.fillMaxSize()) {
                              drawCircle(Color(0x66FFFFFF), 16f, center, style = Stroke(2f))
                              drawCircle(Color(0x66FFFFFF), 2f, center)
                          }
                          Text(
                              "HP 100   AMMO 30/90   ALIVE 38",
                              Modifier.align(Alignment.TopStart).padding(8.dp),
                              fontSize = 10.sp, color = Color(0xCCFFFFFF)
                          )
                          hud.items.forEach { item ->
                              val sizeDp = if (item.id.startsWith("fire")) hud.fireSize else 46
                              val sizePx = sizeDp * dens
                              Box(
                                  Modifier
                                      .offset { IntOffset((item.x * wPx - sizePx / 2f).roundToInt(), (item.y * hPx - sizePx / 2f).roundToInt()) }
                                      .size(sizeDp.dp)
                                      .alpha(hud.opacity / 100f)
                                      .background(N7Red, CircleShape)
                                      .pointerInput(item.id) {
                                          detectDragGestures(onDragEnd = { app.save() }) { change, drag ->
                                              change.consume()
                                              val cur = app.active.hud.items.first { it.id == item.id }
                                              val nh = app.active.hud.move(
                                                  item.id,
                                                  (cur.x + drag.x / wPx).coerceIn(0.04f, 0.96f),
                                                  (cur.y + drag.y / hPx).coerceIn(0.06f, 0.94f)
                                              )
                                              app.update(app.active.copy(hud = nh), save = false)
                                          }
                                      },
                                  contentAlignment = Alignment.Center
                              ) {
                                  Text(item.label, fontSize = 10.sp, color = Color.White, fontWeight = FontWeight.Bold)
                              }
                          }
                      }
                      Dim("A simulated game screen. Nothing is injected into Free Fire: copy these positions into the game's own HUD editor.")
                  }

                  GlassCard("SIZE AND OPACITY") {
                      Row {
                          Text("Fire button size", Modifier.weight(1f))
                          Text("${hud.fireSize}", color = N7Blue, fontWeight = FontWeight.Bold)
                      }
                      Slider(
                          value = hud.fireSize.toFloat(),
                          onValueChange = { app.update(p.copy(hud = hud.copy(fireSize = it.roundToInt())), save = false) },
                          onValueChangeFinished = { app.save(); app.log("Fire button size ${app.active.hud.fireSize}") },
                          valueRange = 40f..120f,
                          colors = SliderDefaults.colors(thumbColor = N7Red, activeTrackColor = N7Red)
                      )
                      Row {
                          Text("Opacity", Modifier.weight(1f))
                          Text("${hud.opacity}%", color = N7Blue, fontWeight = FontWeight.Bold)
                      }
                      Slider(
                          value = hud.opacity.toFloat(),
                          onValueChange = { app.update(p.copy(hud = hud.copy(opacity = it.roundToInt())), save = false) },
                          onValueChangeFinished = { app.save(); app.log("HUD opacity ${app.active.hud.opacity}%") },
                          valueRange = 20f..100f,
                          colors = SliderDefaults.colors(thumbColor = N7Red, activeTrackColor = N7Red)
                      )
                  }

                  GlassCard("HUD PRESETS") {
                      Dim("Presets replace this profile's layout. Your layout is saved automatically per profile.")
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          listOf("Default", "Wide fire", "Compact").forEach { n ->
                              Btn(n, Modifier.weight(1f)) {
                                  app.update(p.copy(hud = Hud.preset(n)))
                                  app.log("Applied HUD preset $n")
                              }
                          }
                      }
                  }
              }
          }
