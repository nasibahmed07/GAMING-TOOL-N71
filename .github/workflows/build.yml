          import com.n7elite.gaming.ui.theme.*
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          enum class Screen(val title: String, val desc: String) {
              Dashboard("Dashboard", ""),
              Sensitivity("Sensitivity Manager", "Sliders, live preview, presets, import/export"),
              Profiles("Gaming Profiles", "Rush, Sniper, Balanced and Custom"),
              Hud("HUD Configurator", "Drag buttons, size and opacity"),
              Aim("Aim Training", "Targets, reaction time, tracking"),
              Recoil("Recoil Simulator", "Drag-control practice"),
              Perf("Device Performance", "Real readings and advice"),
              Settings("Settings", "Vibration and data")
          }

          val AIM_MODES = listOf("Static", "Moving", "Reaction", "Tracking")
          val DIFFS = listOf("Easy", "Medium", "Hard")

          fun fmtActivity(s: String): String {
              val i = s.indexOf('|')
              if (i < 0) return s
              val t = s.substring(0, i).toLongOrNull() ?: return s
              return SimpleDateFormat("HH:mm", Locale.getDefault()).format(Date(t)) + "  " + s.substring(i + 1)
          }

          @Composable
          fun GlassCard(title: String, modifier: Modifier = Modifier, content: @Composable ColumnScope.() -> Unit) {
              Card(
                  modifier = modifier.fillMaxWidth(),
                  shape = RoundedCornerShape(18.dp),
                  colors = CardDefaults.cardColors(containerColor = Color(0x33FFFFFF)),
                  border = BorderStroke(1.dp, Brush.linearGradient(listOf(N7Red, N7Blue)))
              ) {
                  Column(Modifier.padding(16.dp)) {
                      if (title.isNotEmpty()) {
                          Text(title, color = N7Blue, fontSize = 12.sp, letterSpacing = 2.sp, fontWeight = FontWeight.Bold)
                      }
                      Column(Modifier.padding(top = 8.dp), content = content)
                  }
              }
          }

          @Composable
          fun InfoRow(label: String, value: String) {
              Row(
                  Modifier.fillMaxWidth().padding(vertical = 3.dp),
                  horizontalArrangement = Arrangement.SpaceBetween,
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Text(label, color = N7TextDim, fontSize = 13.sp)
                  Text(value, fontSize = 13.sp, fontWeight = FontWeight.Medium)
              }
          }

          @Composable
          fun Dim(text: String) {
              Text(text, color = N7TextDim, fontSize = 12.sp, modifier = Modifier.padding(vertical = 2.dp))
          }

          @Composable
          fun Header(title: String, onBack: () -> Unit) {
              Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                  TextButton(onClick = onBack) { Text("< Back", color = N7Blue) }
                  Text(title, fontSize = 18.sp, fontWeight = FontWeight.Black, color = N7Red, fontFamily = FontFamily.Monospace)
              }
          }

          @Composable
          fun Btn(text: String, modifier: Modifier = Modifier, enabled: Boolean = true, onClick: () -> Unit) {
              Button(
                  onClick = onClick,
                  enabled = enabled,
                  modifier = modifier,
                  colors = ButtonDefaults.buttonColors(containerColor = N7Red)
              ) { Text(text) }
          }

          @Composable
          fun Chip(text: String, selected: Boolean, enabled: Boolean = true, onClick: () -> Unit) {
              FilterChip(
                  selected = selected,
                  enabled = enabled,
                  onClick = onClick,
                  label = { Text(text) },
                  colors = FilterChipDefaults.filterChipColors(
                      selectedContainerColor = N7Red,
                      selectedLabelColor = Color.White
                  )
              )
          }
