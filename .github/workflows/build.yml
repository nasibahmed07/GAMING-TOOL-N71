          package com.n7elite.gaming.ui

          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.Text
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.hapticfeedback.HapticFeedbackType
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.layout.onSizeChanged
          import androidx.compose.ui.platform.LocalDensity
          import androidx.compose.ui.platform.LocalHapticFeedback
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.n7elite.gaming.data.*
          import com.n7elite.gaming.ui.theme.*
          import kotlin.math.cos
          import kotlin.math.hypot
          import kotlin.math.roundToInt
          import kotlin.math.sin
          import kotlin.random.Random

          @Composable
          fun AimScreen(app: AppState, onBack: () -> Unit) {
              val dens = LocalDensity.current.density
              val haptic = LocalHapticFeedback.current
              var mode by remember { mutableStateOf("Static") }
              var diff by remember { mutableIntStateOf(app.active.difficulty) }
              var phase by remember { mutableIntStateOf(0) } // 0 ready, 1 running, 2 finished
              var w by remember { mutableFloatStateOf(600f) }
              var h by remember { mutableFloatStateOf(800f) }
              var timeLeft by remember { mutableFloatStateOf(30f) }
              var hits by remember { mutableIntStateOf(0) }
              var misses by remember { mutableIntStateOf(0) }
              var tx by remember { mutableFloatStateOf(0f) }
              var ty by remember { mutableFloatStateOf(0f) }
              var vx by remember { mutableFloatStateOf(0f) }
              var vy by remember { mutableFloatStateOf(0f) }
              var visible by remember { mutableStateOf(true) }
              var spawnAt by remember { mutableLongStateOf(0L) }
              var shownAt by remember { mutableLongStateOf(0L) }
              var reactSum by remember { mutableLongStateOf(0L) }
              var reactN by remember { mutableIntStateOf(0) }
              var trackOn by remember { mutableFloatStateOf(0f) }
              var trackTotal by remember { mutableFloatStateOf(0f) }
              var pointer by remember { mutableStateOf<Offset?>(null) }
              var result by remember { mutableStateOf<TrainRecord?>(null) }
              var newBest by remember { mutableStateOf(false) }
              val radius = listOf(62f, 44f, 30f)[diff] * dens
              val speed = listOf(150f, 250f, 380f)[diff] * dens
              val scroll = rememberScrollState()

              fun spawn() {
                  val m = radius + 6f
                  tx = m + Random.nextFloat() * (w - 2f * m).coerceAtLeast(1f)
                  ty = m + Random.nextFloat() * (h - 2f * m).coerceAtLeast(1f)
                  if (mode == "Moving" || mode == "Tracking") {
                      val a = Random.nextFloat() * 6.2831f
                      vx = cos(a) * speed
                      vy = sin(a) * speed
                  } else {
                      vx = 0f
                      vy = 0f
                  }
              }

              fun start() {
                  hits = 0; misses = 0; reactSum = 0L; reactN = 0; trackOn = 0f; trackTotal = 0f
                  timeLeft = 30f; result = null; newBest = false; pointer = null
                  spawn()
                  if (mode == "Reaction") {
                      visible = false
                      spawnAt = System.currentTimeMillis() + Random.nextLong(900L, 2200L)
                  } else {
                      visible = true
                  }
                  phase = 1
              }

              fun finish() {
                  val tr = mode == "Tracking"
                  val acc = if (tr) (trackOn / trackTotal.coerceAtLeast(0.01f) * 100f).roundToInt()
                  else if (hits + misses > 0) hits * 100 / (hits + misses) else 0
                  val score = if (tr) acc * 10 else maxOf(0, hits * 10 - misses * 3)
                  val rec = TrainRecord(
                      System.currentTimeMillis(), mode, DIFFS[diff], score,
                      if (tr) trackOn.roundToInt() else hits,
                      if (tr) (trackTotal - trackOn).roundToInt() else misses,
                      acc, if (reactN > 0) (reactSum / reactN).toInt() else 0
                  )
                  newBest = score > app.best(mode, DIFFS[diff])
                  app.addRecord(rec)
                  result = rec
                  phase = 2
              }

              fun onTap(p: Offset) {
                  if (phase != 1 || mode == "Tracking") return
                  val now = System.currentTimeMillis()
                  if (visible && hypot(p.x - tx, p.y - ty) <= radius) {
                      hits++
                      if (app.haptics) haptic.performHapticFeedback(HapticFeedbackType.LongPress)
                      if (mode == "Reaction") {
                          reactSum += now - shownAt
                          reactN++
                          visible = false
                          spawnAt = now + Random.nextLong(900L, 2200L)
                      } else {
                          spawn()
                      }
                  } else {
                      misses++
                  }
              }

              LaunchedEffect(phase) {
                  if (phase == 1) {
                      var last = withFrameNanos { it }
                      while (phase == 1) {
                          val now = withFrameNanos { it }
                          val dt = ((now - last) / 1_000_000_000f).coerceAtMost(0.05f)
                          last = now
                          timeLeft -= dt
                          if (mode == "Moving" || mode == "Tracking") {
                              tx += vx * dt
                              ty += vy * dt
                              if (tx < radius) { tx = radius; vx = kotlin.math.abs(vx) }
                              if (tx > w - radius) { tx = w - radius; vx = -kotlin.math.abs(vx) }
                              if (ty < radius) { ty = radius; vy = kotlin.math.abs(vy) }
                              if (ty > h - radius) { ty = h - radius; vy = -kotlin.math.abs(vy) }
                          }
                          if (mode == "Reaction" && !visible && System.currentTimeMillis() >= spawnAt) {
                              spawn()
                              visible = true
                              shownAt = System.currentTimeMillis()
                          }
                          if (mode == "Tracking") {
                              trackTotal += dt
                              val pt = pointer
                              if (pt != null && hypot(pt.x - tx, pt.y - ty) <= radius * 1.2f) trackOn += dt
                          }
                          if (timeLeft <= 0f) finish()
                      }
                  }
              }

              val liveAcc = if (mode == "Tracking") {
                  if (trackTotal > 0f) (trackOn / trackTotal * 100f).roundToInt() else 0
              } else if (hits + misses > 0) hits * 100 / (hits + misses) else 0

              Column(
                  Modifier.fillMaxSize().verticalScroll(scroll, enabled = phase != 1).padding(16.dp),
                  verticalArrangement = Arrangement.spacedBy(12.dp)
              ) {
                  Header("AIM TRAINING", onBack)

                  GlassCard("SETUP") {
                      Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                          AIM_MODES.forEach { m -> Chip(m, mode == m, enabled = phase != 1) { mode = m } }
                      }
                      Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                          DIFFS.forEachIndexed { i, d -> Chip(d, diff == i, enabled = phase != 1) { diff = i } }
                      }
                      Dim(
                          when (mode) {
                              "Static" -> "Tap each target as fast as you can. Targets stay still."
                              "Moving" -> "Tap targets while they bounce around."
                              "Reaction" -> "Wait for the target, then tap it. Early taps count as misses."
                              else -> "Keep your finger on the moving target. Score is the % of time on target."
                          } + " 30 seconds."
                      )
                      Btn(if (phase == 1) "Running..." else "Start", enabled = phase != 1) { start() }
                  }

                  Text(
                      "Time ${"%.1f".format(timeLeft.coerceAtLeast(0f))}s   Hits $hits   Misses $misses   Acc $liveAcc%",
                      fontWeight = FontWeight.Bold, fontSize = 14.sp
                  )

                  Box(
                      Modifier
                          .fillMaxWidth()
                          .height(380.dp)
                          .clip(RoundedCornerShape(14.dp))
                          .background(Color(0xFF0E1620))
                          .onSizeChanged { w = it.width.toFloat(); h = it.height.toFloat() }
                          .pointerInput(diff, mode) {
                              awaitPointerEventScope {
                                  while (true) {
                                      val ev = awaitPointerEvent()
                                      val c = ev.changes.firstOrNull() ?: continue
                                      if (phase == 1) {
                                          pointer = if (c.pressed) c.position else null
                                          if (c.pressed && !c.previousPressed) onTap(c.position)
                                          c.consume()
                                      }
                                  }
                              }
                          }
                  ) {
                      Canvas(Modifier.fillMaxSize()) {
                          if (phase == 1 && visible) {
                              val c = Offset(tx, ty)
                              drawCircle(N7Red, radius, c)
                              drawCircle(Color.White, radius * 0.62f, c)
                              drawCircle(N7Red, radius * 0.28f, c)
                          }
                          val pt = pointer
                          if (mode == "Tracking" && pt != null) drawCircle(N7Blue, 16f, pt, style = Stroke(3f))
                      }
                      if (phase == 0) {
                          Text("Pick a mode and difficulty, then tap Start", Modifier.align(Alignment.Center).padding(24.dp), color = N7TextDim)
                      }
                      if (phase == 1 && mode == "Reaction" && !visible) {
                          Text("Wait for the target...", Modifier.align(Alignment.Center), color = N7Blue, fontSize = 18.sp)
                      }
                      if (phase == 2) {
                          result?.let { r ->
                              Column(Modifier.align(Alignment.Center).padding(24.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                                  Text("ROUND COMPLETE", color = N7Red, fontWeight = FontWeight.Black, fontSize = 20.sp)
                                  Text("Score ${r.score}", fontSize = 28.sp, fontWeight = FontWeight.Bold)
                                  Text("Accuracy ${r.accuracy}%  |  ${r.hits} hit  |  ${r.misses} miss")
                                  if (r.avgReaction > 0) Text("Average reaction ${r.avgReaction} ms")
                                  if (newBest) Text("NEW PERSONAL BEST!", color = N7Blue, fontWeight = FontWeight.Bold)
                              }
                          }
                      }
                  }

                  GlassCard("PERSONAL BEST ($mode, ${DIFFS[diff]})") {
                      Text("${app.best(mode, DIFFS[diff])}", fontSize = 22.sp, fontWeight = FontWeight.Bold, color = N7Blue)
                  }

                  GlassCard("TRAINING HISTORY") {
                      if (app.records.isEmpty()) Dim("No rounds yet.")
                      app.records.take(8).forEach {
                          Text(
                              "${it.mode} ${it.diff}: score ${it.score}, ${it.accuracy}%" + if (it.avgReaction > 0) ", ${it.avgReaction} ms" else "",
                              fontSize = 12.sp, modifier = Modifier.padding(vertical = 2.dp)
                          )
                      }
                  }
              }
          }
