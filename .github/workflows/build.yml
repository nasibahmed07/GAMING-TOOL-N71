          cat > app/src/main/java/com/n7elite/gaming/ui/RecoilScreen.kt <<'N7EOF'
          package com.n7elite.gaming.ui

          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.Text
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.platform.LocalDensity
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.n7elite.gaming.data.*
          import com.n7elite.gaming.ui.theme.*
          import kotlin.math.hypot
          import kotlin.math.roundToInt
          import kotlin.math.sin
          import kotlin.random.Random
          import kotlinx.coroutines.delay

          val RECOIL = listOf("Vertical climb", "Drift right", "Zig-zag")

          /** Where recoil pushes shot number i, in dp, relative to the target centre. */
          fun recoilAt(pattern: Int, i: Int): Offset = when (pattern) {
              0 -> Offset(0f, -i * 3.2f)
              1 -> Offset(i * 1.0f, -i * 2.6f)
              else -> Offset(sin(i * 0.7f) * 14f, -i * 2.4f)
          }

          fun scoreColor(s: Int): Color = when (s) {
              10 -> Color(0xFF00E676)
              6 -> Color(0xFFFFEA00)
              3 -> Color(0xFFFF9100)
              else -> Color.Gray
          }

          @Composable
          fun RecoilScreen(app: AppState, onBack: () -> Unit) {
              val dens = LocalDensity.current.density
              var pattern by remember { mutableIntStateOf(0) }
              val impacts = remember { mutableStateListOf<Offset>() }
              val scores = remember { mutableStateListOf<Int>() }
              var firing by remember { mutableStateOf(false) }
              var startP by remember { mutableStateOf(Offset.Zero) }
              var curP by remember { mutableStateOf(Offset.Zero) }
              var done by remember { mutableStateOf(false) }
              var runs by remember { mutableIntStateOf(0) }
              var summary by remember { mutableStateOf("") }
              val mag = 30

              fun finishRun() {
                  val total = scores.sum()
                  val good = scores.count { it >= 6 }
                  runs++
                  summary = "Score $total / ${mag * 10}  |  ${good * 100 / mag}% of shots in the inner rings"
                  if (total > app.recoilBest) {
                      app.setRecoilBest(total)
                      summary += "  |  NEW BEST!"
                  }
                  app.log("Recoil ${RECOIL[pattern]}: $total/${mag * 10}")
                  done = true
              }

              LaunchedEffect(firing) {
                  while (firing && impacts.size < mag) {
                      val i = impacts.size
                      val r = recoilAt(pattern, i)
                      val comp = (curP - startP) / dens
                      val jitter = Offset(Random.nextFloat() * 6f - 3f, Random.nextFloat() * 6f - 3f)
                      val imp = Offset(r.x + comp.x, r.y + comp.y) + jitter
                      val d = hypot(imp.x, imp.y)
                      impacts.add(imp)
                      scores.add(if (d <= 15f) 10 else if (d <= 35f) 6 else if (d <= 60f) 3 else 0)
                      delay(100)
                  }
                  if (firing && impacts.size >= mag) {
                      firing = false
                      finishRun()
                  }
              }

              val shown = impacts.size
              val pull = if (shown > 0) -recoilAt(pattern, shown - 1).y else 0f
              val counter = if (firing) (curP.y - startP.y) / dens else 0f

              Column(
                  Modifier.fillMaxSize().verticalScroll(rememberScrollState(), enabled = !firing).padding(16.dp),
                  verticalArrangement = Arrangement.spacedBy(12.dp)
              ) {
                  Header("RECOIL SIMULATOR", onBack)

                  GlassCard("HOW IT WORKS") {
                      Dim("A standalone practice game. Press and hold on the target area to fire. The shots climb (red dots show the climb). Slide your finger DOWN while firing to pull the shots back to the centre. Nothing here touches Free Fire.")
                      Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                          RECOIL.forEachIndexed { i, n -> Chip(n, pattern == i, enabled = !firing) { pattern = i } }
                      }
                      Btn("New magazine", enabled = !firing) {
                          impacts.clear(); scores.clear(); done = false; summary = ""
                      }
                  }

                  Text(
                      "Shots $shown/$mag   Score ${scores.sum()}   Pull ${pull.roundToInt()} dp   Your counter ${counter.roundToInt()} dp",
                      fontWeight = FontWeight.Bold, fontSize = 13.sp
                  )

                  Box(
                      Modifier
                          .fillMaxWidth()
                          .height(380.dp)
                          .clip(RoundedCornerShape(14.dp))
                          .background(Color(0xFF0E1620))
                          .pointerInput(Unit) {
                              awaitPointerEventScope {
                                  while (true) {
                                      val ev = awaitPointerEvent()
                                      val c = ev.changes.firstOrNull() ?: continue
                                      if (!done) {
                                          if (c.pressed && !c.previousPressed) {
                                              startP = c.position
                                              curP = c.position
                                              firing = true
                                          } else if (c.pressed) {
                                              curP = c.position
                                          } else if (c.previousPressed) {
                                              firing = false
                                          }
                                          c.consume()
                                      }
                                  }
                              }
                          }
                  ) {
                      Canvas(Modifier.fillMaxSize()) {
                          val centre = Offset(size.width / 2f, size.height * 0.42f)
                          drawCircle(Color(0x33FFFFFF), 60f * dens, centre, style = Stroke(2f))
                          drawCircle(Color(0x55FFFFFF), 35f * dens, centre, style = Stroke(2f))
                          drawCircle(Color(0x99FFFFFF), 15f * dens, centre, style = Stroke(2f))
                          for (i in 0 until mag) {
                              val r = recoilAt(pattern, i)
                              drawCircle(Color(0x44FF1744), 2.5f * dens, Offset(centre.x + r.x * dens, centre.y + r.y * dens))
                          }
                          impacts.forEachIndexed { i, o ->
                              drawCircle(scoreColor(scores[i]), 4f * dens, Offset(centre.x + o.x * dens, centre.y + o.y * dens))
                          }
                          if (firing) drawLine(N7Blue, startP, curP, 4f)
                      }
                      if (shown == 0 && !firing) {
                          Text("Press and hold here to fire", Modifier.align(Alignment.BottomCenter).padding(16.dp), color = N7TextDim)
                      }
                      if (done) {
                          Text(
                              summary, Modifier.align(Alignment.BottomCenter).padding(16.dp),
                              color = N7Blue, fontWeight = FontWeight.Bold
                          )
                      }
                  }

                  GlassCard("STATISTICS") {
                      InfoRow("Best magazine score", "${app.recoilBest} / ${mag * 10}")
                      InfoRow("Magazines this session", "$runs")
                      Dim("Scoring: inner ring 10, middle 6, outer 3. Green dots are your shots, red dots are where recoil alone would send them.")
                  }
              }
          }
